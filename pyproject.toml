[project]
name = "enterprise-rag-assistant"
version = "0.1.0"
description = "Enterprise IT and data knowledge RAG assistant with FastAPI, Next.js, PostgreSQL, and pgvector."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.0",
    "pgvector>=0.3.0",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.0.0",
]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
    # Makes Python trust the OS certificate store instead of its own bundled one --
    # needed on networks with a TLS-inspecting corporate proxy (e.g. HuggingFace Hub
    # downloads for the embeddings extra otherwise fail with CERTIFICATE_VERIFY_FAILED).
    "pip-system-certs>=4.0; sys_platform == 'win32'",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
