[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus"
version = "0.1.0"
description = "Nexus -- Enterprise Knowledge Platform. Grounded question answering over enterprise IT and data knowledge, built with FastAPI, Next.js, PostgreSQL, and pgvector."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.0",
    "pgvector>=0.3.0",
    # Cover the default free-tier LLM_PROVIDERS chain (generation/llm_client.py):
    # google-genai for Gemini, openai for the OpenAI-wire-compatible providers (OpenAI
    # itself, Groq, OpenRouter, and a local Ollama server all reuse the same client).
    "google-genai>=0.3.0",
    "openai>=1.50.0",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.0.0",
]
# Anthropic is a supported LLM_PROVIDERS entry but isn't part of the default free-tier
# chain, so it's opt-in rather than a hard dependency.
anthropic = [
    "anthropic>=0.35.0",
]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
    # Makes Python trust the OS certificate store instead of its own bundled one --
    # needed on networks with a TLS-inspecting corporate proxy (e.g. HuggingFace Hub
    # downloads for the embeddings extra otherwise fail with CERTIFICATE_VERIFY_FAILED).
    "pip-system-certs>=4.0; sys_platform == 'win32'",
]

[tool.setuptools.packages.find]
# Explicit allow-list: setuptools' flat-layout auto-discovery otherwise errors out on
# ambiguity, since directories like data/, docs/, and web/ (the Next.js frontend, its own
# npm project) all look like candidate top-level packages to it.
include = [
    "api*",
    "database*",
    "evaluation*",
    "generation*",
    "ingestion*",
    "monitoring*",
    "retrieval*",
    "scripts*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
